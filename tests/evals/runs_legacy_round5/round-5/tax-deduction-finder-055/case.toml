id = "tax-deduction-finder-055"
name = "Tax deduction finder"
enabled = true
tags = ['code', 'finance', 'tax']
profile = "code"
difficulty = "medium"
input = """
From receipts/ (text receipts), find deductible items per rules.md, produce deductions.csv + tax_summary.md.
"""
expected_output = """
deductions.csv + tax_summary.md with correct deductible items and totals.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "deductions.csv"
exists = true

[[expect.files]]
path = "tax_summary.md"
exists = true

[[expect.tools]]
name = "bash"
min_calls = 2

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "code"
