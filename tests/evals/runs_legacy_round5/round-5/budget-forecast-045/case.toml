id = "budget-forecast-045"
name = "Budget forecast"
enabled = true
tags = ["code","finance","analytics"]
profile = "code"
difficulty = "medium"
input = "Given expenses.csv (12 months), forecast next 3 months, produce forecast.csv + report.md (trend, seasonality note, assumptions)."
expected_output = "forecast.csv (3 rows) + report.md with method and assumptions."
[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600
[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."
[expect]
truncated_ok = false
[[expect.files]]
path = "forecast.csv"
exists = true
[[expect.files]]
path = "report.md"
exists = true
[[expect.tools]]
name = "bash"
min_calls = 2
[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"
[metrics]
profile = "code"