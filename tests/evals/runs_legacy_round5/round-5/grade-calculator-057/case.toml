id = "grade-calculator-057"
name = "Grade calculator"
enabled = true
tags = ['code', 'education', 'analytics']
profile = "code"
difficulty = "medium"
input = """
From grades.csv (students, assignments, weights), compute final grades, letter grades, class stats; write grades_out.csv + stats.md.
"""
expected_output = """
grades_out.csv + stats.md with final grades, letter grades, class stats.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "grades_out.csv"
exists = true

[[expect.files]]
path = "stats.md"
exists = true

[[expect.tools]]
name = "bash"
min_calls = 2

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "code"
