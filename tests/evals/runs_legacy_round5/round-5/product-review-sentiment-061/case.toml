id = "product-review-sentiment-061"
name = "Product review sentiment"
enabled = true
tags = ['code', 'analytics', 'nlp']
profile = "code"
difficulty = "medium"
input = """
Analyze reviews.csv (text + rating); produce sentiment.csv (per-review label + score) + insights.md (themes, top complaints).
"""
expected_output = """
sentiment.csv + insights.md with themes and top complaints.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "sentiment.csv"
exists = true

[[expect.files]]
path = "insights.md"
exists = true

[[expect.tools]]
name = "bash"
min_calls = 2

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "code"
