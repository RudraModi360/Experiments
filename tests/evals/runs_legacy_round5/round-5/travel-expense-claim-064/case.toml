id = "travel-expense-claim-064"
name = "Travel expense claim"
enabled = true
tags = ['code', 'finance', 'expenses']
profile = "code"
difficulty = "medium"
input = """
From receipts/ (text receipts), produce claim.csv + claim_summary.md (totals by category, policy violations).
"""
expected_output = """
claim.csv + claim_summary.md with totals and violations.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "claim.csv"
exists = true

[[expect.files]]
path = "claim_summary.md"
exists = true

[[expect.tools]]
name = "bash"
min_calls = 2

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "code"
