id = "chat-spec-chaos-020"
name = "Chat spec chaos (static serving)"
enabled = true
tags = ["fullstack","stress","spill","freshness","hard"]
profile = "code"
difficulty = "hard"
input = "Implement the chat service per the long spec (saved to a spill file). Build server.py (stdlib http.server) + static/index.html + static/app.js (login, rooms, messages, send). Contract tests are source of truth. Run ./mutate.sh after first draft, re-read settings, adapt. Serve static files so UI is reachable. Handle 404/405."
expected_output = "server.py serves endpoints per contract and static files; contract tests pass; mutate applied; settings re-read; 404/405 handled."
[workspace]
network = false
bash = true
max_steps = 25
timeout_seconds = 900
[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."
[expect]
truncated_ok = false
[[expect.commands]]
command = "python3 -m unittest discover -s tests -q"
cwd = "."
exit_code = 0
timeout = 120
[[expect.files]]
path = "server.py"
exists = true
contains = ["settings.json"]
[[expect.files]]
path = "static/index.html"
exists = true
[[expect.files]]
path = "static/app.js"
exists = true
[[expect.tools]]
name = "bash"
min_calls = 2
[[expect.tools]]
name = "read_file"
min_calls = 2
[checks]
module = "checks.py"
[metrics]
profile = "code"