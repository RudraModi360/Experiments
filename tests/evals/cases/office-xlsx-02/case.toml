id = "office-xlsx-02"
name = "Build multi-currency FY26 Operating Model Excel workbook with live formulas"
description = "Ultra-hard Office XLSX task: parse USD/EUR (European decimals)/INR CSVs, apply PDF FX rates & controller CapEx adjustment, and build multi-tab live-formula workbook."
enabled = true
tags = ["office", "xlsx", "docs", "ultra-hard"]
profile = "docs"
difficulty = "ultra-hard"
grounding = "tool_outputs"

input = '''
Consolidate our regional revenue and expense dumps in `./data`, FX/scenario rules in `docs/fx_rates_and_assumptions.pdf`, and adjustments in `notes/controller_adjustments.md` into a CFO-ready `FY26_Operating_Model.xlsx` with live Excel formulas, a Base/Bull/Bear summary tab, and a variance audit. Report the reconciled FY25 USD totals and FY26 scenarios in your response.
'''

expected_output = '''
Built `FY26_Operating_Model.xlsx` with tabs `Summary`, `Consolidated_USD`, `Variance_Audit`, and `Assumptions` using live Excel formulas.
Reconciled FY25 USD totals: Revenue = $820,000 (US $500,000 + EU $220,000 + IN $100,000), Adjusted OpEx = $497,000 ($512,000 raw minus $15,000 US Q4 CapEx reclassification), Operating Income = $323,000.
FY26 Revenue scenarios: Base (+15%) = $943,000, Bull (+25%) = $1,025,000, Bear (+5%) = $861,000.
'''

[workspace]
network = false
bash = true
max_steps = 30
timeout_seconds = 600

[[workspace.artifacts]]
kind = "docs"
source = "artifacts"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "FY26_Operating_Model.xlsx"
exists = true
min_bytes = 2000

[checks]
module = "checks.py"

[metrics]
profile = "docs"
