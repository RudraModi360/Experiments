version: "3.9"
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - staging.env
    ports:
      - "8080:8080"
  payment-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - staging.env
    environment:
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - redis
  redis:
    image: redis:7.2-alpine
