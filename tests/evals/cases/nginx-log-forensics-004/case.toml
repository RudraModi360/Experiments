id = "nginx-log-forensics-004"
name = "Big-log 502 forensics + nginx fix with exact-number recall"
description = "2.9MB access log forces spill/paging; exact 502 counts must survive compaction into the incident report. Flagship context-stress case."
enabled = true
tags = ["devops", "stress", "spill", "hard"]
profile = "code"
difficulty = "hard"
grounding = "tool_outputs"

input = '''
The service behind `./ops/nginx.conf` returns intermittent 502s. Analyze `./ops/access.log` (it is large — do not cat the whole file) to find the top 3 upstream paths by 502 count and the exact count for each, plus the total 502 count. Fix the nginx config's upstream timeout and keepalive misconfiguration. Validate the config structurally (nginx may not be installed). Write `incident-report.md` citing the exact counts, the top 3 paths, and the specific config lines you changed. Keep the exact numbers available even if your earlier context gets compacted — save them as notes.
'''

expected_output = '''
Total 502 responses: 1847. Top 3 paths by 502 count: /api/reports (912), /api/export (631), /api/search (304). The nginx fixes: proxy_read_timeout raised from 1s to a sane value (e.g. 30s) and upstream keepalive changed from 0 to a positive value (e.g. 16). incident-report.md cites these exact counts and paths and the changed config lines. The numbers were computed from the log (not hallucinated) and survived context compaction via notes.
'''

[workspace]
network = false
bash = true
max_steps = 25
timeout_seconds = 900

[[workspace.artifacts]]
kind = "docs"
source = "artifacts/ops"
target = "ops"
exclude = ["GROUND_TRUTH.json"]

[expect]
truncated_ok = false
must_contain = ["1847"]

[[expect.commands]]
command = "grep -c '\" 502 ' ops/access.log"
cwd = "."
exit_code = 0
contains = ["1847"]
timeout = 60

[[expect.files]]
path = "incident-report.md"
exists = true
contains = ["1847", "912", "631", "304", "/api/reports", "/api/export", "/api/search"]

[[expect.files]]
path = "ops/nginx.conf"
not_contains = ["proxy_read_timeout 1s", "keepalive 0"]

[[expect.tools]]
name = "bash"
min_calls = 3

[[expect.tools]]
name = "save_note"
min_calls = 1

[checks]
module = "checks.py"

[metrics]
profile = "code"
use = ["faithfulness"]
