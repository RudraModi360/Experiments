id = "broken-api-debug-033"
name = "Broken API debug (multi root cause)"
enabled = true
tags = ["code","debug","backend"]
profile = "code"
difficulty = "hard"
input = "The repository in ./repo is a small task API with a failing test suite (auth + routes + store). Run python3 -m unittest discover -s tests, find why tests fail, fix root cause(s) in app code (not tests), re-run to prove green. Report each bug."
expected_output = "All root causes fixed in app code, no test files modified, full unittest suite passes."
[workspace]
network = false
bash = true
max_steps = 22
timeout_seconds = 600
[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "repo"
[expect]
truncated_ok = false
files_unchanged = ["repo/tests/test_auth.py","repo/tests/test_tasks.py","repo/tests/test_store.py"]
[[expect.commands]]
command = "python3 -m unittest discover -s tests -q"
cwd = "repo"
exit_code = 0
timeout = 120
[[expect.tools]]
name = "bash"
min_calls = 2
[[expect.tools]]
name = "read_file"
min_calls = 2
[[expect.tools]]
name = "edit_file"
min_calls = 1
[checks]
module = "checks.py"
[metrics]
profile = "code"