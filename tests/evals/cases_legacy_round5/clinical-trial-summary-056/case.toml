id = "clinical-trial-summary-056"
name = "Clinical trial summary"
enabled = true
tags = ['docs', 'healthcare', 'research']
profile = "docs"
difficulty = "medium"
grounding = "tool_outputs"
input = """
Summarize trial_results.md (arms, endpoints, p-values, adverse events) into trial_summary.md + endpoints.csv.
"""
expected_output = """
trial_summary.md + endpoints.csv with arms, endpoints, p-values, adverse events.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "docs"
source = "artifacts/docs"
target = "docs"

[expect]
truncated_ok = false

[[expect.files]]
path = "trial_summary.md"
exists = true

[[expect.files]]
path = "endpoints.csv"
exists = true

[[expect.tools]]
name = "read_file"
min_calls = 1

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "docs"
