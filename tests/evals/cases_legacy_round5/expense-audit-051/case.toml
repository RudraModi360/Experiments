id = "expense-audit-051"
name = "Expense audit"
enabled = true
tags = ['code', 'finance', 'audit']
profile = "code"
difficulty = "medium"
input = """
Audit expenses.csv against policy.md (limits, categories). Flag violations, produce audit.md + violations.csv.
"""
expected_output = """
audit.md + violations.csv with correct flagged items.
"""

[workspace]
network = false
bash = true
max_steps = 20
timeout_seconds = 600

[[workspace.artifacts]]
kind = "repo"
source = "artifacts/repo"
target = "."

[expect]
truncated_ok = false

[[expect.files]]
path = "audit.md"
exists = true

[[expect.files]]
path = "violations.csv"
exists = true

[[expect.tools]]
name = "bash"
min_calls = 2

[[expect.tools]]
name = "write_file"
min_calls = 2
[checks]
module = "checks.py"

[metrics]
profile = "code"
